name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # Core deps only: the BiLSTM test is skipped when TensorFlow is absent
      - run: pip install -r requirements.txt
      - run: pytest -q
